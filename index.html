<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c2500a">
<meta name="description" content="Demo order-taking and billing app for a small restaurant: tables, bill preview, payments, history and 80mm receipts.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Morya Misal POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sticky header, one-column menu on phones with a bottom tab bar and an order sheet.
   From 900px the menu and the order panel sit side by side. Receipt is 80mm paper. */
:root{
  --bg:#ffffff;
  --surface:#f6f5f4;
  --line:#e6e3e0;
  --fg:#151311;
  --muted:#6a645e;
  --accent:#c2500a;
  --on-accent:#ffffff;
  --accent-soft:#fbece1;
  --ok:#1d7a4b;
  --ok-soft:#e3f3ea;
  --paper:#ffffff;
  --paper-ink:#141414;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Manrope','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono','Courier New',monospace;
  --hd-h:60px;
  --nav-h:62px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121110;--surface:#1c1a18;--line:#2f2b28;--fg:#f3efec;--muted:#a39c95;
    --accent:#f0873f;--on-accent:#1a0e06;--accent-soft:#3a2314;--ok:#52c28a;--ok-soft:#173326;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121110;--surface:#1c1a18;--line:#2f2b28;--fg:#f3efec;--muted:#a39c95;
  --accent:#f0873f;--on-accent:#1a0e06;--accent-soft:#3a2314;--ok:#52c28a;--ok-soft:#173326;
  color-scheme:dark;
}
*{box-sizing:border-box}
html.lock,html.lock body{overflow:hidden}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ic{flex:none;display:block}

/* header */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);height:var(--hd-h)}
.hd-in{height:100%;display:flex;align-items:center;gap:12px;max-width:1240px;margin:0 auto}
.brand{min-width:0;flex:1}
.brand-name{font:700 21px/1.1 var(--f-display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.demo{flex:none;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:7px 11px}
.tabs-d{display:none;gap:4px}
.tabs-d button{height:44px;padding:0 16px;border:0;background:none;border-radius:12px;font-weight:700;color:var(--muted)}
.tabs-d button[aria-current="page"]{background:var(--surface);color:var(--fg)}

/* bottom nav + cart bar (phones) */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{display:grid;grid-template-columns:repeat(3,1fr);height:var(--nav-h)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--accent)}
.cartbar{position:fixed;z-index:25;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 10px);height:60px;border:0;border-radius:16px;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.cartbar .cb-l{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;min-width:0}
.cartbar .cb-l small{opacity:.7;font-size:12px}
.cartbar .cb-r{display:flex;align-items:center;gap:6px;font:700 20px var(--f-display)}

main{max-width:1240px;margin:0 auto;padding-top:12px;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 100px)}

/* menu */
.menu-top{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hd-h));z-index:10;background:var(--bg);padding:4px 0 10px}
.search{position:relative;display:flex;align-items:center}
.search .ic{position:absolute;left:14px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 48px 0 44px;font-size:16px}
.search input::placeholder{color:var(--muted)}
.search .clr{position:absolute;right:4px;width:44px;height:44px;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"],.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.acc[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip .n{font-size:12px;opacity:.7}
.grp-t{font:700 13px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:18px 0 4px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:6px;padding:14px 0;border-bottom:1px solid var(--line);min-height:80px}
.item-name{font-weight:700;font-size:16px;line-height:1.25}
.item-desc{color:var(--muted);font-size:13px;margin-top:2px}
.item-price{font:700 17px var(--f-display);margin-top:4px}
.tag{display:inline-block;vertical-align:2px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 7px;border-radius:6px;margin-left:6px}
.fav{width:44px;height:44px;border:0;background:none;border-radius:12px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.fav[aria-pressed="true"]{color:var(--accent)}
.act{width:116px;height:48px;border-radius:12px}
.add{border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);font-weight:800;font-size:15px}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--accent);color:var(--on-accent);font:700 17px var(--f-display)}
.step button{width:44px;height:48px;border:0;background:none;color:inherit;display:flex;align-items:center;justify-content:center;border-radius:12px}
.empty{padding:40px 8px;text-align:center;color:var(--muted)}

/* order panel */
.order-grid{display:block}
.cart{display:none;position:fixed;inset:0;z-index:40;background:var(--bg);flex-direction:column}
.cart.open{display:flex}
.cart-hd{display:flex;align-items:center;gap:10px;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:12px;border-bottom:1px solid var(--line)}
.cart-hd h2{margin:0;font:700 22px var(--f-display);flex:1}
.cart-hd small{color:var(--muted)}
.icon-btn{width:44px;height:44px;border:0;background:var(--surface);border-radius:12px;display:flex;align-items:center;justify-content:center}
.cart-body{flex:1;overflow-y:auto;padding-top:6px;padding-bottom:16px}
.lbl{margin:18px 0 8px;font:700 12px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.lbl .need{color:var(--accent);letter-spacing:0;text-transform:none;font-size:13px}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.tbl{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:800;position:relative}
.tbl.wide{grid-column:span 2}
.tbl[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tbl .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.tbl[aria-pressed="true"] .dot{background:var(--on-accent)}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.line-n{font-weight:700}
.line-s{color:var(--muted);font-size:13px}
.line .step{grid-row:1 / span 2;grid-column:2;width:124px;height:44px;border-radius:12px}
.line .step button{height:44px}
.line-t{font-weight:700;justify-self:start;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{width:52px;height:48px;border:0;background:var(--bg);font-weight:800}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.disc-row{display:flex;gap:10px}
.disc-row input{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px}
.bill{background:var(--surface);border-radius:16px;padding:14px 16px;margin-top:18px}
.bill-r{display:flex;justify-content:space-between;gap:12px;padding:4px 0;color:var(--muted)}
.bill-r b{color:var(--fg);font-weight:600}
.bill-t{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);margin-top:8px;padding-top:10px}
.bill-t span{font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.bill-t b{font:700 32px var(--f-display);letter-spacing:-.02em}
.cart-ft{border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--bg)}
.pay-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.pay-chips button{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.pay-chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.btn{min-height:54px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-weight:800;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-size:16px;width:100%}
.btn.dark{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.is-off{opacity:.45}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}

/* history + settings */
.h1{font:700 26px var(--f-display);letter-spacing:-.01em;margin:8px 0 12px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border-radius:14px;padding:12px}
.tile small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.tile b{font:700 22px var(--f-display);display:block;margin-top:2px}
.tile.sales b{color:var(--accent)}
.day{margin:20px 0 4px;font:700 13px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hrow{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:14px 0;min-height:76px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.hrow .t{font-weight:800}
.hrow .s{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.hrow .r b{font:700 18px var(--f-display)}
.pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 8px;border-radius:999px}
.pill.paid{background:var(--ok-soft);color:var(--ok)}
.pill.open{background:var(--accent-soft);color:var(--accent)}
.card{background:var(--surface);border-radius:16px;padding:16px;margin-top:14px}
.card h3{margin:0 0 4px;font:700 17px var(--f-display)}
.card p{margin:4px 0;color:var(--muted);font-size:14px}
.field{display:block;margin-top:14px}
.field span{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field input,.field textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:12px 14px;font-size:16px;min-height:50px}
.field textarea{resize:vertical;min-height:84px}
.saved{color:var(--ok);font-size:13px;font-weight:700;min-height:20px;margin-top:10px}
.set-grid{display:block}

/* sheet (bill) */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.sheet-panel{position:relative;width:100%;max-width:460px;max-height:94%;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet-hd{display:flex;align-items:center;gap:12px;padding:16px 16px 12px}
.sheet-hd>div:not(.ok-badge){flex:1;min-width:0}
.sheet-hd .h{font:700 20px var(--f-display)}
.sheet-hd .sub{color:var(--muted);font-size:13px;margin-top:2px}
.ok-badge{width:40px;height:40px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;flex:none}
.sheet-body{flex:1;overflow:auto;background:var(--surface);padding:16px;display:flex;justify-content:center}
.sheet-ft{padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 14px);border-top:1px solid var(--line)}
.hint{font-size:12.5px;color:var(--muted);margin:10px 0 0}
@media (min-width:600px){.sheet{align-items:center}.sheet-panel{border-radius:22px}}

/* receipt: 80mm thermal paper */
.paper{width:302px;max-width:100%;background:var(--paper);color:var(--paper-ink);font:400 12px/1.4 var(--f-mono);padding:16px 15px 18px;box-shadow:0 2px 14px rgba(0,0,0,.14);align-self:flex-start}
.r-demo{text-align:center;font-weight:700;letter-spacing:.06em;border:1px dashed var(--paper-ink);padding:2px 0;margin-bottom:8px}
.r-name{text-align:center;font:700 17px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.02em}
.r-c{text-align:center;font-size:11px}
.r-hr{border:0;border-top:1px dashed var(--paper-ink);margin:8px 0}
.r-hr.dbl{border-top:2px solid var(--paper-ink)}
.r-row{display:flex;justify-content:space-between;gap:8px}
.r-grid{display:grid;grid-template-columns:minmax(0,1fr) 28px 62px;gap:4px}
.r-grid span:nth-child(2){text-align:center}
.r-grid span:nth-child(3){text-align:right}
.r-th{font-weight:700}
.r-it{margin:2px 0}
.r-total{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:16px}
.r-pay{text-align:center;font-weight:700;margin:2px 0}
.r-foot{text-align:center;font-size:11px;margin-top:4px}
#printArea{display:none}

.toast{position:fixed;z-index:80;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 84px);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center}

@media (min-width:900px){
  .tabs-d{display:flex}
  .nav,.cartbar{display:none!important}
  main{padding-bottom:40px}
  .order-grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;align-items:start}
  .cart{display:flex;position:sticky;inset:auto;top:calc(env(safe-area-inset-top,0px) + var(--hd-h) + 16px);max-height:calc(100dvh - var(--hd-h) - 40px);border:1px solid var(--line);border-radius:20px;overflow:hidden;z-index:1}
  .cart-hd{padding-top:14px}
  .cart-hd .icon-btn{display:none}
  .cart-ft{padding-bottom:14px}
  .set-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}
  .toast{bottom:28px}
}
@media (prefers-reduced-motion:no-preference){
  .add,.step,.chip,.tbl,.btn{transition:transform .08s}
  .add:active,.chip:active,.tbl:active,.btn:active,.step button:active{transform:scale(.97)}
}

@media print{
  @page{size:80mm auto;margin:0}
  :root{padding:0!important}
  html,body{background:#fff!important;margin:0!important;padding:0!important;overflow:visible!important}
  body::before{display:none}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea .paper{width:80mm;max-width:none;box-shadow:none;padding:3mm 4mm 6mm;font-size:11.5px;color:#000;background:#fff}
  #printArea .r-hr,#printArea .r-demo{border-color:#000}
}
</style>
</head>
<body>
<header class="hd"><div class="gut hd-in">
  <div class="brand"><div class="brand-name" id="brandName"></div><div class="brand-sub">Orders &amp; billing</div></div>
  <nav class="tabs-d" id="tabsD" aria-label="Sections"></nav>
  <span class="demo" title="Sample data stored only in this browser">Demo mode</span>
</div></header>

<main class="gut" id="view"></main>

<button class="cartbar" id="cartbar" data-act="cart-open" hidden></button>
<nav class="nav" id="nav" aria-label="Sections"><div class="nav-in" id="navIn"></div></nav>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div id="printArea" aria-hidden="true"></div>

/* ---------- money ---------- */
function calc(lines,disc,rate){
  var sub=0,count=0;lines.forEach(function(l){sub+=l.price*l.qty;count+=l.qty});
  var v=Math.max(0,parseFloat(disc&&disc.val)||0);
  var d=(disc&&disc.type==='pct')?sub*Math.min(100,v)/100:Math.min(sub,v);
  d=Math.round(d*100)/100;
  var taxable=sub-d;
  var tax=Math.round(taxable*rate)/100;
  var cgst=Math.floor(tax*100/2)/100,sgst=Math.round((tax-cgst)*100)/100;
  var raw=taxable+tax,total=Math.round(raw);
  return {sub:sub,disc:d,taxable:taxable,tax:tax,cgst:cgst,sgst:sgst,round:Math.round((total-raw)*100)/100,total:total,count:count};
}
function draftLines(){
  return Object.keys(S.draft.items).map(function(id){var it=byId(id);return {id:id,name:it.n,price:it.p,qty:S.draft.items[id]}});
}

function orderCalc(o){return calc(o.items,o.disc,o.taxRate)}

function commit(status){
  var L=draftLines();
  if(!L.length){toast('Add at least one item first');return null}
  if(!S.draft.table){toast('Choose a table first');return null}
  var o=null;for(var i=0;i<S.orders.length;i++)if(S.orders[i].id===S.draft.id)o=S.orders[i];
  if(!o){var no=S.counter++;o={id:'o'+no+'_'+Date.now().toString(36),no:no,bill:prefix(S.settings.name)+'-'+no,createdAt:Date.now()};S.orders.unshift(o)}
  o.table=S.draft.table;o.items=L;o.disc={type:S.draft.disc.type,val:parseFloat(S.draft.disc.val)||0};o.taxRate=S.settings.tax;
  o.status=status;
  if(status==='paid'){o.method=U.pay;o.paidAt=Date.now()}
  S.draft=emptyDraft();U.clearArm=false;persist();
  return o;
}

function textReceipt(o){
  var W=32,s=S.settings,c=orderCalc(o);
  function ctr(t){t=String(t);var p=Math.max(0,Math.floor((W-t.length)/2));return ' '.repeat(p)+t}
  function lr(a,b){a=String(a);b=String(b);var g=W-a.length-b.length;return a+' '.repeat(Math.max(1,g))+b}
  var out=[ctr('*** DEMO BILL ***'),ctr(String(s.name).toUpperCase())];
  String(s.address).split('\n').forEach(function(l){if(l.trim())out.push(ctr(l.trim()))});
  if(s.phone)out.push(ctr('Ph: '+s.phone));
  if(s.gstin)out.push(ctr('GSTIN: '+s.gstin));
  out.push('-'.repeat(W),lr('Bill '+o.bill,o.table),lr(fdate(o.createdAt),ftime(o.createdAt)),'-'.repeat(W));
  o.items.forEach(function(l){out.push(lr(l.name.slice(0,W-12),l.qty+' x '+l.price+' = '+(l.price*l.qty)))});
  out.push('-'.repeat(W),lr('Subtotal',m2(c.sub)));
  if(c.disc)out.push(lr('Discount','-'+m2(c.disc)));
  if(o.taxRate>0)out.push(lr('GST '+o.taxRate+'%',m2(c.tax)));
  if(c.round)out.push(lr('Round off',(c.round<0?'-':'+')+m2(Math.abs(c.round))));
  out.push('='.repeat(W),lr('TOTAL','Rs '+m2(c.total)),'='.repeat(W));
  out.push(ctr(o.status==='paid'?'PAID - '+String(o.method).toUpperCase():'PAYMENT PENDING'));
  if(s.footer)out.push(ctr(s.footer));
  return out.join('\n');
}

function doCopy(){

  function fallback(){

/* ---------- history ---------- */
function renderHistory(){
  var now=Date.now(),paidToday=S.orders.filter(function(o){return o.status==='paid'&&sameDay(o.paidAt,now)});
  var sales=paidToday.reduce(function(a,o){return a+orderCalc(o).total},0);
  var open=S.orders.filter(function(o){return o.status==='open'}).length;
  var list=S.orders.slice().sort(function(a,b){return b.createdAt-a.createdAt}).filter(function(o){return U.hist==='all'||o.status===U.hist});
  var html='<h1 class="h1">Order history</h1>'
   +'<div class="tiles"><div class="tile sales"><small>Sales today</small><b class="num">'+inr(sales)+'</b></div><div class="tile"><small>Bills paid today</small><b class="num">'+paidToday.length+'</b></div><div class="tile"><small>Open orders</small><b class="num">'+open+'</b></div></div>'
   +'<div class="chips" style="padding-top:14px">'+[['all','All'],['open','Open'],['paid','Paid']].map(function(c){return '<button class="chip" data-act="hist" data-v="'+c[0]+'" aria-pressed="'+(U.hist===c[0])+'">'+c[1]+'</button>'}).join('')+'</div>';
  if(!list.length)html+='<div class="empty">No orders here yet.</div>';
  var last='';
  list.forEach(function(o){
    var dl=dayLabel(o.createdAt);
    if(dl!==last){html+='<div class="day">'+dl+'</div>';last=dl}
    var c=orderCalc(o);
    var sum=o.items.slice(0,3).map(function(i){return i.qty+'× '+i.name}).join(', ')+(o.items.length>3?' +'+(o.items.length-3)+' more':'');
    html+='<button class="hrow" data-act="open-order" data-id="'+o.id+'"><div style="min-width:0"><div class="t">'+esc(o.bill)+' <span class="muted" style="font-weight:600">· '+esc(o.table)+' · '+ftime(o.createdAt)+'</span></div><div class="s">'+esc(sum)+'</div></div>'
      +'<div class="r"><b class="num">'+inr(c.total)+'</b><span class="pill '+(o.status==='paid'?'paid':'open')+'">'+(o.status==='paid'?'Paid · '+esc(o.method):'Open')+'</span></div></button>';
  });
  $('#view').innerHTML=html;
}

/* ---------- view ---------- */
function renderView(){

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.getAttribute('data-act'),id=t.getAttribute('data-id'),v=t.getAttribute('data-v');
  switch(a){
    case 'tab':U.tab=v;U.cartOpen=false;U.sheetId=null;window.scrollTo(0,0);render();break;
    case 'cat':U.cat=v;renderChips();renderMenuList();break;
    case 'fav':var k=S.favs.indexOf(id);if(k>=0)S.favs.splice(k,1);else S.favs.push(id);persist();renderChips();renderMenuList();break;
    case 'inc':setQty(id,qtyOf(id)+1);break;
    case 'dec':setQty(id,qtyOf(id)-1);break;
    case 'q-clear':U.q='';var qi=$('#q');if(qi){qi.value='';qi.focus()}t.hidden=true;renderMenuList();break;
    case 'cart-open':U.cartOpen=true;render();break;
    case 'cart-close':U.cartOpen=false;render();break;
    case 'table':pickTable(v);break;
    case 'disc-type':S.draft.disc.type=v;persist();renderCart();break;
    case 'pay-method':U.pay=v;if(U.sheetId)renderSheet();else renderCart();break;
    case 'pay':payNow();break;
    case 'save':holdOrder();break;
    case 'clear':
      if(!draftLines().length&&!S.draft.id){toast('Order is already empty');break}
      if(!U.clearArm){U.clearArm=true;renderCart();setTimeout(function(){if(U.clearArm){U.clearArm=false;renderCart()}},3000);break}
      S.draft=emptyDraft();U.clearArm=false;persist();refreshOrder();toast('Order cleared');break;
    case 'open-order':U.sheetId=id;U.justPaid=false;render();break;
    case 'sheet-close':U.sheetId=null;U.justPaid=false;render();break;
    case 'new-order':U.sheetId=null;U.justPaid=false;U.tab='order';render();break;
    case 'print':doPrint();break;
    case 'copy':doCopy();break;
    case 'mark-paid':markPaid(id);break;
    case 'edit-order':
      var o=S.orders.filter(function(x){return x.id===id})[0];if(!o)break;
      if(draftLines().length&&S.draft.id!==id){toast('Finish or clear the current order first');break}
      loadOrder(o);persist();U.sheetId=null;U.justPaid=false;U.tab='order';U.cartOpen=true;render();break;
    case 'hist':U.hist=v;renderHistory();break;
    case 'reset':
      if(!U.resetArm){U.resetArm=true;renderSettings();setTimeout(function(){if(U.resetArm){U.resetArm=false;if(U.tab==='settings')renderSettings()}},4000);break}
      S=seed();U.resetArm=false;persist();render();toast('Sample data restored');break;
  }
});
var savedT;
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){U.q=t.value;var c=document.querySelector('.clr');if(c)c.hidden=!t.value;renderMenuList();return}
  if(t.id==='discVal'){S.draft.disc.val=Math.max(0,parseFloat(t.value)||0);persist();renderBill();return}
  var key=t.getAttribute&&t.getAttribute('data-set');

    var val=t.value;
    if(key==='tax'){val=Math.min(28,Math.max(0,parseFloat(val)||0))}

  }
});
document.addEventListener('keydown',function(e){
